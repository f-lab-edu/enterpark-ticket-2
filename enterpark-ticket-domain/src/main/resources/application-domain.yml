spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:3307/${LOCAL_MYSQL_NAME}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${LOCAL_MYSQL_USERNAME}
    password: ${LOCAL_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 35
      minimum-idle: 35
      connection-timeout: 30000
      max-lifetime: 297000
      idle-timeout: 250000
      keepalive-time: 200000
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 1000
    open-in-view: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
      password:
server:
  tomcat:
    max-connections: 5000
    accept-count: 200
    threads:
      max: 30
      min-spare: 10
    connection-timeout: 20000
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://${DEV_MYSQL_HOST}:3306/${DEV_MYSQL_NAME}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DEV_MYSQL_USERNAME}
    password: ${DEV_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 35
      minimum-idle: 35
      connection-timeout: 30000
      max-lifetime: 297000
      idle-timeout: 250000
      keepalive-time: 200000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 1000
    open-in-view: false
  flyway:
